const BLOCKADE=false;
const idxOf=(c,p)=>(START[c]+p)%52;
const turnColor=s=>s.players.blue.id===s.currentTurn?'blue':'green';
function legalMoves(s,c,d,nb){const o=opp(c),cnt={};
s.tokens[o].forEach(p=>{if(p>=0&&p<=50){const k=idxOf(o,p);cnt[k]=(cnt[k]||0)+1}});
const res=[];s.tokens[c].forEach((p,i)=>{let np;if(p<0){if(d!==6)return;np=0}else{np=p+d;if(np>56)return}
for(let q=Math.max(p+1,0);q<=Math.min(np,50);q++)if(BLOCKADE&&!nb&&cnt[idxOf(c,q)]>=2)return;res.push(i)});return res}
const act=(n,type,pid,payload)=>({action_id:uuid(),sequence:n.sequence,type,player_id:pid,timestamp:Date.now(),payload});
function switchT(n){n.currentTurn=n.players[opp(turnColor(n))].id;n.phase='roll';n.sixStreak=0}
function doRoll(s,d,pid){const n=clone(s),c=turnColor(n);n.dice=d;n.sequence++;n.sixStreak=d===6?n.sixStreak+1:0;const p={value:d,color:c};
if(n.sixStreak>=3){p.penalty=true;switchT(n)}else if(!legalMoves(n,c,d).length){p.skipped=true;switchT(n)}else n.phase='move';
n.lastAction=act(n,'DICE_ROLLED',pid,p);return n}
function doMove(s,c,i,pid){const n=clone(s),d=n.dice,from=n.tokens[c][i],to=from<0?0:from+d,cap=[],fin=to===56,o=opp(c);
n.tokens[c][i]=to;
if(to<=50&&!SAFE.has(idxOf(c,to)))n.tokens[o].forEach((p,j)=>{if(p>=0&&p<=50&&idxOf(o,p)===idxOf(c,to)){n.tokens[o][j]=-1;cap.push(j)}});
n.sequence++;n.lastAction=act(n,'TOKEN_MOVED',pid,{color:c,token:i,from,to,captured:cap,finished:fin});
if(n.tokens[c].every(p=>p===56)){n.phase='over';n.winner=n.players[c].id;n.lastAction.type='GAME_WON';n.wonId=n.lastAction.action_id}
else if(d===6||cap.length||fin)n.phase='roll';else switchT(n);return n}

function tg(k){set[k]=set[k]?0:1;save();openSet()}function th(t){set.t=t;save();openSet()}
function openRules(){showM(`<h2>RULES</h2><ul><li>Blue vs Green, 4 tokens each. Players alternate turns; Blue starts.</li><li>A token leaves base only on a 6 and goes to your start square.</li><li>Tokens move clockwise exactly the dice number: 51 squares around, then 5 home-lane squares, then the center. An exact roll is needed to finish; overshooting is not allowed.</li><li>Only glowing tokens can be moved. If none can move, the turn passes.</li><li>Extra roll: rolling a 6, capturing, or finishing a token.</li><li>Three 6s in a row cancel that roll and end your turn.</li><li>Start squares and ★ squares are safe: no capture there, tokens may share them.</li><li>Landing on a lone opponent token elsewhere captures it back to base.</li><li>No blockades: any token can pass over other tokens, including two of the opponent's tokens on one square. Same-color tokens may share a square.</li><li>First to bring all 4 tokens to the center wins. Both players must tap Play Again for a rematch.</li></ul><button class="bt" onclick="${S?'hideM()':'hideM()'}">CLOSE</button>`)}
function exitGame(){closeChat();chat=[];unread=0;$('cbd').hidden=true;if(ch){sb.removeChannel(ch);ch=null}room=null;S=V=null;role=null;lastSeq=-1;nameSent=0;overOn=0;initing=0;busy=0;ls('nl_room',null);hideM();show('home')}
/* FIREWORKS */
const fx=$('fx'),fc=fx.getContext('2d');let P=[],raf=0;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}addEventListener('resize',sizeFx);
function burst(x,y,col,n){n=n||40;const h=Math.random()*360;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1.5+Math.random()*5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col||`hsl(${h+Math.random()*50},100%,60%)`})}if(!raf)raf=requestAnimationFrame(floop)}
function floop(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;p.l-=.013;fc.globalAlpha=Math.max(p.l,0);fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,2.6,0,6.28);fc.fill()});fc.globalAlpha=1;if(P.length)raf=requestAnimationFrame(floop);else{raf=0;fc.clearRect(0,0,fx.width,fx.height)}}
function showers(ms){const t=setInterval(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.08+Math.random()*.4),null,55);sfx('cap')},420);setTimeout(()=>clearInterval(t),ms)}
/* AUDIO */
let AC;function tone(f,d=.1,t='sine',v=.15,at=0){if(!set.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+at;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const SFX={roll:()=>[0,1,2,3,4,5].forEach(k=>tone(200+k*40,.05,'square',.07,k*.1)),move:()=>tone(520,.07,'triangle'),cap:()=>{tone(300,.15,'sawtooth',.12);tone(150,.25,'sawtooth',.12,.12)},six:()=>[500,650,800].forEach((f,k)=>tone(f,.1,'triangle',.15,k*.08)),btn:()=>tone(700,.04),win:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.2,'triangle',.2,k*.14)),err:()=>tone(180,.2,'square',.1)};
const sfx=n=>{try{SFX[n]()}catch(e){}};
const vib=p=>{if(set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
/* INSTALL */

(function(){try{const mk=z=>{const c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d');['#3b82f6','#facc15','#22c55e','#ef4444'].forEach((k,i)=>{x.fillStyle=k;x.fillRect(i%2*z/2,(i>>1)*z/2,z/2,z/2)});x.fillStyle='#fff';x.beginPath();x.arc(z/2,z/2,z*.27,0,6.28);x.fill();x.fillStyle='#111';x.font='800 '+z*.3+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('LV',z/2,z/2+z*.02);return c.toDataURL()};
const m={name:'LudoVerse',short_name:'LudoVerse',display:'fullscreen',orientation:'portrait',background_color:'#0f1220',theme_color:'#0f1220',start_url:location.href.split('#')[0].split('?')[0],icons:[{src:mk(192),sizes:'192x192',type:'image/png'},{src:mk(512),sizes:'512x512',type:'image/png'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=mk(180);document.head.appendChild(a)}catch(e){}})();
/* BOOT */
(async()=>{buildBoard();sizeFx();document.body.dataset.t=set.t;
$('face').innerHTML='<span></span>'.repeat(9);setFace(0);$('nm').value=ls('nl_name')||'';nameIn();$('avb').textContent=av;const rm=new URLSearchParams(location.search).get('room');if(rm){$('jc').value=rm.toUpperCase().slice(0,6);$('jr').hidden=false;setTimeout(()=>toast('Enter your name, then tap JOIN'),800)}
